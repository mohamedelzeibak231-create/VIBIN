<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vibin</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    :root {
      --bg: #121212; --panel: #1c1c1e; --panel2: #2a2a2d; --text: #f5f5f7; --muted: #9a9aa5;
      --accent: #ff6a88; --accent2: #8e54e9; --like: #ff2d55; --line: #2e2e32;
      --hdr: 60px; --side: 244px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    input, textarea, select { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    .app { display: grid; grid-template-columns: var(--side) 1fr; grid-template-rows: var(--hdr) 1fr; height: 100vh; height: 100dvh; }

    /* Header */
    .top { grid-column: 1 / 3; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 5; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 1.6rem; font-weight: 800; }
    .logo img { width: 34px; height: 34px; border-radius: 10px; }
    .logo span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .search { flex: 0 1 380px; display: flex; align-items: center; background: var(--panel2); border-radius: 999px; padding: 0 6px 0 18px; }
    .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 11px 0; }
    .search button { width: 38px; height: 38px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }
    .search button:hover { color: var(--text); }
    .hright { display: flex; align-items: center; gap: 12px; position: relative; }
    .btn { padding: 10px 22px; border-radius: 6px; font-weight: 700; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; white-space: nowrap; }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: .5; cursor: default; filter: none; }
    .btn.ghost { background: var(--panel2); color: var(--text); }
    .btn.line { background: none; border: 1px solid var(--line); color: var(--text); }
    .btn.sm { padding: 7px 16px; font-size: .9rem; }
    .up-btn { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; font-weight: 600; }
    .up-btn:hover { background: var(--panel2); }
    .av { border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; user-select: none; }
    .chip { display: flex; align-items: center; cursor: pointer; }
    .umenu { position: absolute; top: 48px; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 190px; padding: 6px; z-index: 40; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
    .umenu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 8px; text-align: left; font-weight: 600; }
    .umenu button:hover { background: var(--panel2); }

    /* Sidebar */
    .side { grid-row: 2; grid-column: 1; overflow-y: auto; padding: 12px 12px 20px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
    .nav { display: flex; align-items: center; gap: 14px; padding: 11px 12px; border-radius: 10px; font-weight: 700; font-size: 1.05rem; width: 100%; text-align: left; color: var(--text); }
    .nav:hover { background: var(--panel2); }
    .nav.active { color: var(--accent); }
    .nav .ico { width: 26px; display: grid; place-items: center; }
    .sect { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .sect h4 { font-size: .85rem; color: var(--muted); font-weight: 600; margin: 0 12px 8px; }
    .sug { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; width: 100%; text-align: left; }
    .sug:hover { background: var(--panel2); }
    .sug b { font-size: .95rem; }
    .side-foot { margin-top: auto; padding: 14px 12px 0; font-size: .75rem; color: var(--muted); }
    .side-foot a { text-decoration: underline; }

    main { grid-row: 2; grid-column: 2; position: relative; overflow: hidden; min-width: 0; }
    .view { display: none; position: absolute; inset: 0; overflow-y: auto; }
    .view.active { display: block; }
    #view-feed { overflow: hidden; }

    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; min-height: 100%; }
    .center h2 { font-size: 1.5rem; }
    .center p { color: var(--muted); max-width: 420px; line-height: 1.5; }
    .bigico { color: var(--muted); opacity: .8; }
    .spin { width: 34px; height: 34px; border: 3px solid var(--panel2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .steps { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 22px; line-height: 1.7; max-width: 460px; }

    /* Feed */
    .feedbox { height: 100%; position: relative; }
    .feed { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
    .feed::-webkit-scrollbar { display: none; }
    .post .stage { transform-origin: 50% 50%; backface-visibility: hidden; }
    @media (prefers-reduced-motion: reduce) { .post .stage { transform: none !important; opacity: 1 !important; } }
    .otp-hint { color: var(--muted); font-size: .85rem; margin: -2px 0 10px; }
    .linkbtn { background: none; border: 0; color: var(--accent2); font-weight: 600; padding: 6px 0; cursor: pointer; }
    .linkbtn:disabled { opacity: .5; cursor: default; }
    .post { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; padding: 14px 0; }
    .stage { display: flex; align-items: flex-end; gap: 16px; height: 100%; max-width: 100%; }
    .screen { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
    .screen video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    .screen video.cover { object-fit: cover; }
    .screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(to top, rgba(0,0,0,.65), transparent); pointer-events: none; }
    .tbtn { position: absolute; top: 12px; z-index: 4; width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.4); display: grid; place-items: center; color: #fff; }
    .tbtn:hover { background: rgba(0,0,0,.65); }
    .mutebtn { left: 12px; }
    .morebtn { right: 12px; }
    .flash { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; background: rgba(0,0,0,.45); display: none; place-items: center; color: #fff; pointer-events: none; z-index: 3; }
    .flash svg { fill: #fff; margin-left: 4px; }
    .screen.paused .flash { display: grid; }
    .meta { position: absolute; left: 16px; right: 16px; bottom: 20px; z-index: 3; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
    .meta .un { font-weight: 800; font-size: 1.05rem; }
    .meta .un:hover { text-decoration: underline; }
    .meta .when { color: rgba(255,255,255,.7); font-weight: 400; font-size: .85rem; margin-left: 6px; }
    .cap { margin-top: 6px; font-size: .95rem; line-height: 1.4; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cap.open { display: block; max-height: 140px; overflow-y: auto; }
    .cap a { font-weight: 700; }
    .cap a:hover { text-decoration: underline; }
    .moretxt { font-weight: 700; margin-top: 2px; font-size: .9rem; }
    .snd { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .9rem; max-width: 90%; }
    .snd span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; z-index: 5; cursor: pointer; display: flex; align-items: flex-end; touch-action: none; }
    .bar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.25); transition: height .12s; }
    .bar:hover::before { height: 6px; }
    .bar i { position: relative; display: block; height: 3px; width: 0; background: #fff; transition: height .12s; }
    .bar:hover i { height: 6px; }
    .burst { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; color: var(--like); pointer-events: none; z-index: 6; animation: burst .8s ease-out forwards; }
    .burst svg { fill: var(--like); stroke: none; }
    @keyframes burst { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 20% { transform: scale(1.15) rotate(-8deg); opacity: 1; } 70% { transform: scale(1) rotate(-8deg); opacity: 1; } 100% { transform: scale(1.3) translateY(-30px) rotate(-8deg); opacity: 0; } }
    .menu { position: absolute; top: 56px; right: 12px; z-index: 8; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 170px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
    .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 8px; text-align: left; font-weight: 600; }
    .menu button:hover { background: var(--panel2); }
    .menu button.danger { color: #ff6b6b; }

    .rail { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 6px; }
    .avwrap { position: relative; margin-bottom: 14px; display: block; }
    .plus { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--like); color: #fff; display: grid; place-items: center; }
    .rbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .78rem; font-weight: 600; color: var(--text); }
    .rbtn .c { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; transition: transform .1s; }
    .rbtn:hover .c { background: rgba(255,255,255,.2); }
    .rbtn:active .c { transform: scale(.9); }
    .rbtn.on .c svg { fill: currentColor; }
    .rbtn.like.on { color: var(--like); }
    .rbtn.save.on { color: #ffc93c; }
    .disc { width: 40px; height: 40px; border-radius: 50%; background: conic-gradient(#222, #555, #222, #555, #222); display: grid; place-items: center; animation: spin 4s linear infinite; margin-top: 4px; }
    .disc i { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: block; }

    #feednav { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 6; }
    #feednav button { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; }
    #feednav button:hover { background: rgba(255,255,255,.22); }
    #ftabs { display: none; }

    /* Photo posts */
    .slides-wrap { position: absolute; inset: 0; background: #000; z-index: 1; }
    .slides { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
    .slides::-webkit-scrollbar { display: none; }
    .slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; display: grid; place-items: center; }
    .slide img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    .dots { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 4; pointer-events: none; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); display: block; }
    .dots i.on { background: #fff; }
    .pcount { position: absolute; top: 12px; left: 12px; z-index: 4; background: rgba(0,0,0,.45); color: #fff; font-size: .8rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; pointer-events: none; }
    .sarr { position: absolute; top: 50%; transform: translateY(-50%); z-index: 4; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; }
    .sarr:hover { background: rgba(0,0,0,.7); }
    .sarr.prev { left: 10px; } .sarr.next { right: 10px; }
    @media (hover: none) { .sarr { display: none; } }
    .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; background: rgba(0,0,0,.5); color: #fff; border-radius: 999px; padding: 4px 8px; font-size: .75rem; font-weight: 700; display: flex; align-items: center; gap: 4px; }

    /* Comments panel */
    #cpanel { position: absolute; top: 0; right: 0; bottom: 0; width: 380px; max-width: 100%; background: var(--panel); border-left: 1px solid var(--line); z-index: 20; display: none; flex-direction: column; }
    #cpanel.show { display: flex; }
    .chead { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); font-weight: 800; }
    .chead button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
    .chead button:hover { background: var(--panel2); }
    #clist { flex: 1; overflow-y: auto; padding: 8px 18px; }
    .cmuted { color: var(--muted); text-align: center; padding: 28px 0; }
    .cm { display: flex; gap: 10px; padding: 10px 0; }
    .cm .body { flex: 1; min-width: 0; }
    .cm .who { font-weight: 700; font-size: .9rem; color: var(--muted); }
    .cm .txt { margin: 2px 0; line-height: 1.4; overflow-wrap: anywhere; }
    .cm .when { font-size: .8rem; color: var(--muted); }
    .cm .del { color: var(--muted); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; align-self: center; }
    .cm .del:hover { background: var(--panel2); color: #ff6b6b; }
    .screen { color: #fff; }
    :root[data-theme="light"] { --bg: #fff; --panel: #f5f5f7; --panel2: #ebebef; --text: #161823; --muted: #6b6b76; --line: #e4e4e9; }
    :root[data-theme="light"] .bottom { background: var(--bg); }
    :root[data-theme="light"] .cp.active { color: #fff; }
    :root[data-theme="light"] .bio { color: var(--text); }
    :root[data-theme="light"] .rbtn .c { background: rgba(0,0,0,.07); }
    @media (max-width: 760px) { :root[data-theme="light"] .rbtn:not(.on) { color: #fff; } :root[data-theme="light"] .rbtn .c { background: rgba(255,255,255,.14); } }
    .setbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .srow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line); }
    .srow:last-child { border-bottom: 0; }
    button.srow:hover { background: var(--panel2); }
    .srow .st { flex: 1; min-width: 0; }
    .srow .sl { font-weight: 700; }
    .srow .ss { color: var(--muted); font-size: .85rem; margin-top: 2px; overflow-wrap: anywhere; }
    .srow .sv { color: var(--muted); font-size: .9rem; }
    .srow.danger .sl { color: #ff6b6b; }
    .srow select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--text); }
    .tgl { width: 46px; height: 28px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); position: relative; flex: none; transition: background .15s; }
    .tgl i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: left .15s; }
    .tgl.on { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; }
    .tgl.on i { left: 21px; }
    .acct .btn { margin-left: 6px; }
    .cm.rep { margin-left: 46px; }
    .showrep { margin: 0 0 6px 46px; color: var(--muted); font-weight: 700; font-size: .85rem; }
    .showrep:hover { color: var(--text); }
    .cm .acts { display: flex; gap: 14px; align-items: center; font-size: .8rem; color: var(--muted); }
    .cm .acts button { color: var(--muted); font-weight: 700; font-size: .8rem; }
    .cm .acts button:hover { color: var(--text); }
    .cm .lk { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: .72rem; align-self: center; min-width: 28px; }
    .cm .lk.on { color: var(--like); }
    .cm .lk.on svg { fill: currentColor; }
    .cm .txt a, .bio a { font-weight: 700; }
    .mention { position: fixed; z-index: 95; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
    .mention button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; font-weight: 600; }
    .mention button:hover { background: var(--panel2); }
    .cform { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
    .cform input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid transparent; border-radius: 999px; padding: 11px 16px; outline: none; }
    .cform input:focus { border-color: var(--accent2); }
    .cform button { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; color: #fff; }
    .cform button:disabled { opacity: .5; }

    /* Viewer overlay (open a video from a grid) */
    #viewer { position: absolute; inset: 0; background: var(--bg); z-index: 15; display: none; }
    #viewer.show { display: block; }
    #vclose { position: absolute; left: 14px; top: 14px; z-index: 12; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; }
    #vclose:hover { background: rgba(255,255,255,.25); }

    /* Grids */
    .page { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
    .page h1 { font-size: 1.6rem; margin-bottom: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .cp { padding: 8px 16px; border-radius: 999px; background: var(--panel2); font-weight: 600; font-size: .92rem; }
    .cp:hover { filter: brightness(1.2); }
    .cp.active { background: var(--text); color: #000; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .tile { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: #000; cursor: pointer; }
    .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(to top, rgba(0,0,0,.7), transparent); pointer-events: none; }
    .tviews { position: absolute; left: 10px; bottom: 8px; z-index: 2; display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: .85rem; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
    .tviews svg { fill: #fff; }
    .tinfo { position: absolute; left: 10px; right: 10px; bottom: 30px; z-index: 2; font-size: .85rem; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
    .tinfo .tc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .tinfo .tu { color: rgba(255,255,255,.8); margin-top: 2px; }
    .section-h { font-size: 1.1rem; font-weight: 800; margin: 22px 0 10px; }
    .acct { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 10px; width: 100%; text-align: left; }
    .acct:hover { background: var(--panel2); }

    /* Profile */
    .phead { display: flex; gap: 24px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .pinfo h1 { font-size: 1.7rem; margin: 0 0 8px; }
    .pbtns { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
    .stats { display: flex; gap: 20px; margin: 10px 0; flex-wrap: wrap; }
    .stats b { font-size: 1.1rem; margin-right: 4px; }
    .stats span { color: var(--muted); }
    .bio { color: #d4d4da; max-width: 480px; line-height: 1.45; overflow-wrap: anywhere; }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .tabs button { padding: 12px 22px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs button.active { color: var(--text); border-color: var(--text); }

    /* Upload */
    .upwrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
    .upwrap h1 { font-size: 1.6rem; }
    .upwrap .sub { color: var(--muted); margin: 6px 0 22px; }
    .uprow { display: flex; gap: 28px; flex-wrap: wrap; }
    .drop { width: 260px; aspect-ratio: 9 / 16; border: 2px dashed var(--line); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; text-align: center; padding: 16px; background: var(--panel); overflow: hidden; position: relative; flex: none; }
    .drop.over { border-color: var(--accent2); background: var(--panel2); }
    .drop video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .drop p { color: var(--muted); font-size: .9rem; }
    .upform { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 12px; }
    .upform label { font-weight: 700; }
    .upform textarea { width: 100%; height: 110px; resize: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
    .upform textarea:focus { border-color: var(--accent2); }
    .counter { text-align: right; font-size: .8rem; color: var(--muted); }
    .prog { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; }

    var email = $("fEmail").value.trim(), pass = $("fPass").value, name = $("fUser").value.trim();
    var err = $("authError");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = "Enter a valid email."; return; }
    if (pass.length < 6) { err.textContent = "Password must be at least 6 characters."; return; }
    if (mode === "signup" && !/^[A-Za-z0-9_.]{2,20}$/.test(name)) { err.textContent = "Username: 2 to 20 letters, numbers, _ or ."; return; }
    if (!sb) { err.textContent = "Logins are not connected yet."; return; }
    var btn = $("mSubmit"); btn.disabled = true; err.textContent = "";
    var p = mode === "signup"
      ? sb.auth.signUp({ email: email, password: pass, options: { data: { username: name.toLowerCase() }, emailRedirectTo: location.origin + location.pathname } })
      : sb.auth.signInWithPassword({ email: email, password: pass });
    p.then(function (res) {
      btn.disabled = false;
      if (res.error) { err.textContent = res.error.message; return; }
      $("fPass").value = "";
      if (mode === "signup" && !res.data.session) { closeModal(); toast("Check your email to confirm your account"); }
    }).catch(function () { btn.disabled = false; err.textContent = "Something went wrong. Try again."; });
  });

  /* ---------- search, tabs, keys ---------- */
  $("searchBtn").innerHTML = svg("search", 20);
  $("ftSearch").innerHTML = svg("search", 22);
  $("navUp").innerHTML = svg("up", 22); $("navDown").innerHTML = svg("down", 22);
  $("navUp").addEventListener("click", function () { var f = curFeed(); if (f) f.step(-1); });
  $("navDown").addEventListener("click", function () { var f = curFeed(); if (f) f.step(1); });
  $("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = $("search").value.trim(); if (!q) return;
    go("#/search/" + encodeURIComponent(q));
  });
  $("ftSearch").addEventListener("click", function () {
    var q = prompt("Search vibin"); if (q && q.trim()) go("#/search/" + encodeURIComponent(q.trim()));
  });
  document.querySelectorAll("#ftabs [data-ft]").forEach(function (b) {
    b.addEventListener("click", function () { go("#/" + b.dataset.ft); });
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if ($("authModal").classList.contains("show")) return;
    var f = curFeed(); if (!f) return;
    if (e.key === "ArrowDown") { e.preventDefault(); f.step(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); f.step(-1); }
    else if (e.key === "ArrowRight") f.slide(1);
    else if (e.key === "ArrowLeft") f.slide(-1);
    else if (e.key === "m" || e.key === "M") setMuted(!state.muted);
    else if (e.key === "l" || e.key === "L") f.toggleLike();
    else if (e.key === " ") { e.preventDefault(); f.togglePlay(); }
    else if (e.key === "Escape") { if (viewerFeed) { closeViewer(); closeComments(); } else closeComments(); }
  });

  /* ---------- start ---------- */
  try { setTheme(localStorage.getItem("vibin_theme") === "light" ? "light" : "dark"); } catch (e) {}
  buildNav();
  renderAuthArea();
  if (sb) {
    sb.auth.getSession().then(function (r) { applySession(r.data.session, false); });
    sb.auth.onAuthStateChange(function (evt, session) {
      if (session) saveAcct(session);
      if (evt === "INITIAL_SESSION" || evt === "TOKEN_REFRESHED" || evt === "USER_UPDATED") return;
      if (evt === "SIGNED_IN" && session && state.user && state.user.id === session.user.id) return;
      setTimeout(function () { applySession(session, evt === "SIGNED_IN" || evt === "SIGNED_OUT"); }, 0);
    });
    loadSuggested();
  } else {
    route();
  }
})();
</script>
<script src="create.js" charset="utf-8"></script>
<script src="messages.js"></script>
</body>
</html>
