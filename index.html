<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vibin</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    :root {
      --bg: #0f0d1a;
      --panel: #181526;
      --panel2: #221e36;
      --text: #f4f1ff;
      --muted: #9a93b8;
      --accent: #ff6a88;
      --accent2: #8e54e9;
      --line: #2e2a47;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    input { font: inherit; color: inherit; }
    svg { display: block; }

    .app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 64px 1fr; height: 100vh; }

    /* Sidebar */
    .sidebar { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line);
      padding: 18px 12px; display: flex; flex-direction: column; gap: 6px; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 1.6rem; font-weight: 800; padding: 4px 12px 16px; }
    .logo img { width: 36px; height: 36px; border-radius: 10px; }
    .logo span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nav { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px;
      font-weight: 600; color: var(--muted); text-align: left; width: 100%; }
    .nav .ico { color: #fff; display: grid; place-items: center; width: 26px; }
    .nav:hover { background: var(--panel2); color: var(--text); }
    .nav.active { background: var(--panel2); color: var(--text); }
    .side-foot { margin-top: auto; padding: 12px; font-size: 0.75rem; color: var(--muted); }

    /* Top bar */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--bg); }
    .search { flex: 1; max-width: 420px; background: var(--panel2); border-radius: 999px;
      padding: 10px 18px; border: 1px solid transparent; outline: none; }
    .search:focus { border-color: var(--accent2); }
    .btn { padding: 10px 22px; border-radius: 999px; font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
    .btn:hover { filter: brightness(1.1); }
    .btn.ghost { background: var(--panel2); color: var(--text); }
    .userchip { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); font-weight: 800; }

    /* Views */
    main { overflow: hidden; position: relative; }
    .view { display: none; height: 100%; overflow-y: auto; }
    .view.active { display: block; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 24px; min-height: 100%; }
    .center h2 { font-size: 1.5rem; }
    .center p { color: var(--muted); max-width: 380px; }
    .center .bigico { color: var(--muted); opacity: .8; }

    /* Feed */
    #feed { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; }
    #feed.empty { scroll-snap-type: none; }
    .post { height: calc(100vh - 64px); scroll-snap-align: start; display: flex; align-items: center; justify-content: center; padding: 14px; }
    .screen { position: relative; height: 100%; max-height: 760px; aspect-ratio: 9 / 16; max-width: 100%;
      border-radius: 18px; overflow: hidden; background: #000; }
    .screen video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .meta { position: absolute; left: 16px; right: 84px; bottom: 64px; text-shadow: 0 1px 6px rgba(0,0,0,.8); pointer-events: none; }
    .meta b { display: block; margin-bottom: 4px; }
    .actions { position: absolute; right: 12px; bottom: 64px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .act { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.72rem; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
    .act .c { width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; color: #fff; }
    .act:hover .c { background: rgba(255,255,255,.2); }
    .act.on .c { background: var(--accent); }
    .act.on svg { fill: #fff; }

    /* Explore */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; padding: 24px; }
    .tile { aspect-ratio: 9 / 14; border-radius: 14px; background: #000; overflow: hidden; cursor: pointer; position: relative; }
    .tile video { width: 100%; height: 100%; object-fit: cover; }
    .tile small { position: absolute; left: 10px; bottom: 8px; font-size: 0.75rem; text-shadow: 0 1px 4px rgba(0,0,0,.8); }

    /* Forms */
    .form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
    .field { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; width: 100%; }
    .field:focus { border-color: var(--accent2); }

    /* Modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .overlay.show { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; width: 100%; max-width: 400px; padding: 26px; position: relative; max-height: 100%; overflow-y: auto; }
    .modal h3 { font-size: 1.4rem; margin-bottom: 4px; }
    .modal .sub { color: var(--muted); margin-bottom: 18px; font-size: 0.9rem; }
    .close { position: absolute; top: 12px; right: 14px; font-size: 1.4rem; color: var(--muted); }
    .social { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; margin-bottom: 10px; border: 1px solid var(--line); background: var(--panel2); }
    .social:hover { border-color: var(--accent2); }
    .or { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 12px 0; }
    .switch { text-align: center; margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
    .switch button { color: var(--accent); font-weight: 700; }
    .note { font-size: 0.75rem; color: var(--muted); margin-top: 10px; text-align: center; }
    .error { color: #ff8a8a; font-size: 0.85rem; min-height: 1.1em; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #fff; color: #222;
      padding: 12px 20px; border-radius: 999px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 80; max-width: 90%; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 62px; }
      .sidebar { grid-row: 3; grid-column: 1; flex-direction: row; padding: 4px; border-right: 0; border-top: 1px solid var(--line); justify-content: space-around; }
      .logo, .side-foot { display: none; }
      .nav { flex-direction: column; gap: 2px; padding: 6px 4px; justify-content: center; font-size: 0.65rem; text-align: center; width: auto; flex: 1; }
      .topbar { grid-row: 1; padding: 0 12px; }
      main { grid-row: 2; }
      .post { height: calc(100vh - 122px); }
    }
  </style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo"><img src="logo.svg" alt=""><span>vibin</span></div>
    <button class="nav active" data-view="foryou"><span class="ico" data-icon="home"></span><span>For You</span></button>
    <button class="nav" data-view="following"><span class="ico" data-icon="users"></span><span>Following</span></button>
    <button class="nav" data-view="explore"><span class="ico" data-icon="compass"></span><span>Explore</span></button>
    <button class="nav" data-view="live"><span class="ico" data-icon="live"></span><span>Live</span></button>
    <button class="nav" data-view="upload"><span class="ico" data-icon="plus"></span><span>Upload</span></button>
    <button class="nav" data-view="profile"><span class="ico" data-icon="user"></span><span>Profile</span></button>
    <div class="side-foot">vibin &middot; good vibes only</div>
  </aside>

  <header class="topbar">
    <input class="search" id="search" type="search" placeholder="Search videos">
    <div id="authArea"></div>
  </header>

  <main>
    <section class="view active" id="view-foryou"><div id="feed"></div></section>
    <section class="view" id="view-following"><div class="center" id="followingBody"></div></section>
    <section class="view" id="view-explore"><div id="exploreBody"></div></section>
    <section class="view" id="view-live"><div class="center" id="liveBody"></div></section>
    <section class="view" id="view-upload"><div class="center" id="uploadBody"></div></section>
    <section class="view" id="view-profile"><div class="center" id="profileBody"></div></section>
  </main>
</div>

<!-- Sign in / sign up -->
<div class="overlay" id="authModal">
  <div class="modal">
    <button class="close" id="closeModal" aria-label="Close">&times;</button>
    <h3 id="mTitle">Log in to vibin</h3>
    <p class="sub" id="mSub">Welcome back. Pick a way to continue.</p>

    <button class="social" data-provider="Google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>
    <button class="social" data-provider="Discord">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.4a18 18 0 0 1 4.3 1.6 15 15 0 0 0-15 0A18 18 0 0 1 8.8 3.4L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 0 13.5.3 17.9A20 20 0 0 0 6.4 21l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a20 20 0 0 0 6.1-3.1c.4-5.1-.7-9.6-3.2-13.5zM8.5 15.2c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4z"/></svg>
      Continue with Discord
    </button>

    <div class="or">or use email</div>

    <form class="form" id="authForm" novalidate>
      <input class="field" id="fUser" type="text" placeholder="Username" autocomplete="username" style="display:none">
      <input class="field" id="fEmail" type="email" placeholder="Email" autocomplete="email">
      <input class="field" id="fPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="error" id="authError"></div>
      <button class="btn" type="submit" id="mSubmit">Log in</button>
    </form>

    <div class="switch" id="switchLine"></div>
    <div class="note" id="setupNote"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  /* ---------- SETUP: paste your two Supabase values here ---------- */
  var SUPABASE_URL = "https://fomasnzofymhafhomdux.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_2i35gbEiTyxxSG98TcDRjg_YeHnI3S_";
  /* ---------------------------------------------------------------- */

  /* ---------- icons (white line icons) ---------- */
  var P = {
    home: '<path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
    live: '<circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>',
    plus: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/>',
    user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
    message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    bookmark: '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
    share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>',
    video: '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>'
  };
  function svg(name, size) {
    size = size || 22;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + P[name] + '</svg>';
  }
  function icon(name, size, cls) { var s = document.createElement("span"); if (cls) s.className = cls; s.innerHTML = svg(name, size); return s; }
  document.querySelectorAll("[data-icon]").forEach(function (n) { n.innerHTML = svg(n.dataset.icon, 24); });

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "K" : String(n); }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  /* ---------- state ---------- */
  var posts = [];          // starts empty: no videos until someone uploads
  var liked = {}, saved = {};
  var user = null;
  var sb = null;
  try {
    if (window.supabase && SUPABASE_URL.indexOf("https://") === 0 && SUPABASE_ANON_KEY.length > 20) {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (e) { sb = null; }

  function emptyState(container, iconName, title, text, btnText, btnView) {
    container.textContent = "";
    container.appendChild(icon(iconName, 64, "bigico"));
    container.appendChild(el("h2", null, title));
    container.appendChild(el("p", null, text));
    if (btnText) {
      var b = el("button", "btn", btnText);
      b.addEventListener("click", function () { if (btnView === "login") openModal("login"); else show(btnView); });
      container.appendChild(b);
    }
  }

  /* ---------- views ---------- */
  var current = "foryou";
  function show(view) {
    current = view;
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    $("view-" + view).classList.add("active");
    document.querySelectorAll(".nav").forEach(function (n) { n.classList.toggle("active", n.dataset.view === view); });
    if (view === "following") renderFollowing();
    if (view === "explore") renderExplore();
    if (view === "live") emptyState($("liveBody"), "live", "Nobody is live", "Live streams will show up here.");
    if (view === "upload") renderUpload();
    if (view === "profile") renderProfile();
  }
  document.querySelectorAll(".nav").forEach(function (n) { n.addEventListener("click", function () { show(n.dataset.view); }); });

  function needLogin() { if (!user) { openModal("login"); return true; } return false; }

  /* ---------- feed ---------- */
  function actionBtn(iconName, label, on) {
    var b = el("button", "act" + (on ? " on" : ""));
    var c = el("span", "c"); c.innerHTML = svg(iconName, 24); b.appendChild(c);
    var l = el("span", "lbl", label); b.appendChild(l);
    return { btn: b, label: l };
  }
  function renderFeed() {
    var feed = $("feed"); feed.textContent = "";
    var q = $("search").value.trim().toLowerCase();
    var list = posts.filter(function (p) { return !q || (p.user + " " + p.caption).toLowerCase().indexOf(q) !== -1; });
    feed.classList.toggle("empty", !list.length);
    if (!list.length) {
      var c = el("div", "center"); c.style.height = "100%";
      if (q) emptyState(c, "video", "No videos found", "Nothing matches that search.");
      else emptyState(c, "video", "No videos here", "Videos will show up here once someone uploads one.", "Upload a video", "upload");
      feed.appendChild(c); return;
    }
    list.forEach(function (p) {
      var wrap = el("div", "post");
      var screen = el("div", "screen");
      var v = document.createElement("video");
      v.src = p.video; v.controls = true; v.loop = true; v.playsInline = true; v.preload = "metadata";
      v.setAttribute("controlsList", "nodownload");
      screen.appendChild(v);

      var meta = el("div", "meta"); meta.appendChild(el("b", null, "@" + p.user)); meta.appendChild(el("span", null, p.caption)); screen.appendChild(meta);

      var actions = el("div", "actions");
      var key = p.id;

      var like = actionBtn("heart", fmt(p.likes + (liked[key] ? 1 : 0)), liked[key]);
      like.btn.addEventListener("click", function () {
        if (needLogin()) return;
        liked[key] = !liked[key]; like.btn.classList.toggle("on", !!liked[key]); like.label.textContent = fmt(p.likes + (liked[key] ? 1 : 0));
      });

      var chat = actionBtn("message", "Comment");
      chat.btn.addEventListener("click", function () { if (!needLogin()) toast("Comments are coming soon"); });

      var save = actionBtn("bookmark", saved[key] ? "Saved" : "Save", saved[key]);
      save.btn.addEventListener("click", function () {
        if (needLogin()) return;
        saved[key] = !saved[key]; save.btn.classList.toggle("on", !!saved[key]); save.label.textContent = saved[key] ? "Saved" : "Save";
        toast(saved[key] ? "Saved to your list" : "Removed from saved");
      });

      var share = actionBtn("share", "Share");
      share.btn.addEventListener("click", function () {
        var url = location.href;
        if (navigator.share) { navigator.share({ title: "vibin", text: p.caption, url: url }).catch(function () {}); return; }
        try { navigator.clipboard.writeText(url).then(function () { toast("Link copied"); }, function () { toast("Copy the page address to share"); }); }
        catch (e) { toast("Copy the page address to share"); }
      });

      [like, chat, save, share].forEach(function (a) { actions.appendChild(a.btn); });
      screen.appendChild(actions);
      wrap.appendChild(screen); feed.appendChild(wrap);
    });
  }
  $("search").addEventListener("input", function () { if (current !== "foryou") show("foryou"); renderFeed(); });

  /* ---------- explore ---------- */
  function renderExplore() {
    var box = $("exploreBody"); box.textContent = "";
    if (!posts.length) {
      var c = el("div", "center"); emptyState(c, "compass", "Nothing to explore yet", "Videos will appear here once they are uploaded.");
      box.appendChild(c); return;
    }
    var g = el("div", "grid");
    posts.forEach(function (p) {
      var t = el("div", "tile");
      var v = document.createElement("video"); v.src = p.video; v.muted = true; v.preload = "metadata"; t.appendChild(v);
      t.appendChild(el("small", null, "@" + p.user));
      t.addEventListener("click", function () { show("foryou"); });
      g.appendChild(t);
    });
    box.appendChild(g);
  }

  /* ---------- following / profile / upload ---------- */
  function renderFollowing() {
    var c = $("followingBody");
    if (!user) return emptyState(c, "users", "See who you follow", "Log in to follow creators and see their videos here.", "Log in", "login");
    emptyState(c, "users", "You are not following anyone yet", "Follow creators and their videos will show up here.", "Explore", "explore");
  }
  function renderProfile() {
    var c = $("profileBody");
    if (!user) return emptyState(c, "user", "Your profile", "Log in or sign up to get your own profile.", "Log in", "login");
    c.textContent = "";
    var d = el("div", "dot", user.name.charAt(0).toUpperCase()); d.style.width = d.style.height = "96px"; d.style.fontSize = "2.4rem"; c.appendChild(d);
    c.appendChild(el("h2", null, "@" + user.name));
    var mine = posts.filter(function (p) { return p.user === user.name; }).length;
    var savedCount = Object.keys(saved).filter(function (k) { return saved[k]; }).length;
    c.appendChild(el("p", null, "0 Following  |  0 Followers  |  " + mine + " Videos  |  " + savedCount + " Saved"));
    var out = el("button", "btn ghost", "Log out"); out.addEventListener("click", logout); c.appendChild(out);
  }
  function renderUpload() {
    var c = $("uploadBody");
    if (!user) return emptyState(c, "plus", "Upload a video", "Log in to post your own videos.", "Log in", "login");
    c.textContent = "";
    c.appendChild(icon(video_ico(), 64, "bigico"));
    c.appendChild(el("h2", null, "Upload a video"));
    c.appendChild(el("p", null, "Pick a video from your device. In this demo it only shows on your own screen, and it is gone when you refresh."));
    var form = el("div", "form");
    var file = document.createElement("input"); file.type = "file"; file.accept = "video/*"; file.className = "field";
    var cap = document.createElement("input"); cap.type = "text"; cap.placeholder = "Caption"; cap.className = "field"; cap.maxLength = 120;
    var go = el("button", "btn", "Post");
    go.addEventListener("click", function () {
      if (!file.files[0]) { toast("Choose a video first"); return; }
      posts.unshift({ id: "p" + Date.now(), user: user.name, caption: cap.value.trim() || "New video", likes: 0, video: URL.createObjectURL(file.files[0]) });
      renderFeed(); show("foryou"); toast("Posted");
    });
    form.appendChild(file); form.appendChild(cap); form.appendChild(go); c.appendChild(form);
  }
  function video_ico() { return "video"; }

  /* ---------- auth ---------- */
  var mode = "login";
  function renderAuthArea() {
    var a = $("authArea"); a.textContent = "";
    if (user) {
      var chip = el("div", "userchip"); chip.appendChild(el("div", "dot", user.name.charAt(0).toUpperCase())); chip.appendChild(el("span", null, user.name));
      a.appendChild(chip);
    } else {
      var b = el("button", "btn", "Log in"); b.addEventListener("click", function () { openModal("login"); }); a.appendChild(b);
    }
  }
  function setMode(m) {
    mode = m;
    var signup = m === "signup";
    $("mTitle").textContent = signup ? "Join vibin" : "Log in to vibin";
    $("mSub").textContent = signup ? "Make an account to like, save, follow and post." : "Welcome back. Pick a way to continue.";
    $("fUser").style.display = signup ? "block" : "none";
    $("mSubmit").textContent = signup ? "Sign up" : "Log in";
    var line = $("switchLine"); line.textContent = signup ? "Already have an account? " : "Do not have an account? ";
    var b = el("button", null, signup ? "Log in" : "Sign up"); b.type = "button";
    b.addEventListener("click", function () { setMode(signup ? "login" : "signup"); });
    line.appendChild(b);
    $("authError").textContent = "";
  }
  function openModal(m) { setMode(m || "login"); $("authModal").classList.add("show"); }
  function closeModal() { $("authModal").classList.remove("show"); }
  function logout() { if (sb) sb.auth.signOut(); }
  function applySession(session, announce) {
    var was = user;
    if (session && session.user) {
      var u = session.user, md = u.user_metadata || {};
      var name = String(md.username || md.user_name || md.full_name || md.name || (u.email || "vibin").split("@")[0])
        .replace(/\s+/g, "").slice(0, 24) || "vibin";
      user = { id: u.id, name: name, email: u.email, provider: (u.app_metadata && u.app_metadata.provider) || "email" };
      closeModal();
      if (announce && !was) toast("Welcome, " + name);
    } else {
      user = null;
      if (announce && was) toast("Logged out");
    }
    renderAuthArea(); renderFeed(); show(user ? current : "foryou");
  }

  $("closeModal").addEventListener("click", closeModal);
  $("authModal").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
  document.querySelectorAll(".social").forEach(function (b) {
    b.addEventListener("click", function () {
      if (!sb) { toast("Logins are not connected yet"); return; }
      sb.auth.signInWithOAuth({
        provider: b.dataset.provider.toLowerCase(),
        options: { redirectTo: location.origin + location.pathname }
      }).then(function (res) { if (res.error) toast(res.error.message); });
    });
  });
  $("authForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = $("fEmail").value.trim(), pass = $("fPass").value, name = $("fUser").value.trim();
    var err = $("authError");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = "Enter a valid email."; return; }
    if (pass.length < 6) { err.textContent = "Password must be at least 6 characters."; return; }
    if (mode === "signup") {
      if (!/^[A-Za-z0-9_.]{2,24}$/.test(name)) { err.textContent = "Username: 2 to 24 letters, numbers, _ or ."; return; }
    }
    if (!sb) { err.textContent = "Logins are not connected yet."; return; }
    var btn = $("mSubmit"); btn.disabled = true; err.textContent = "";
    var p = mode === "signup"
      ? sb.auth.signUp({ email: email, password: pass, options: { data: { username: name }, emailRedirectTo: location.origin + location.pathname } })
      : sb.auth.signInWithPassword({ email: email, password: pass });
    p.then(function (res) {
      btn.disabled = false;
      if (res.error) { err.textContent = res.error.message; return; }
      $("fPass").value = "";
      if (mode === "signup" && !res.data.session) { closeModal(); toast("Check your email to confirm your account"); }
    }).catch(function () { btn.disabled = false; err.textContent = "Something went wrong. Try again."; });
  });

  renderAuthArea();
  renderFeed();
  if (sb) {
    sb.auth.getSession().then(function (r) { applySession(r.data.session, false); });
    sb.auth.onAuthStateChange(function (evt, session) { applySession(session, evt === "SIGNED_IN" || evt === "SIGNED_OUT"); });
  } else {
    $("setupNote").textContent = "Logins are not connected yet.";
  }
})();
</script>
</body>
</html>
